<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides</title>
  <link rel="stylesheet" href="assets/slides.css">
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const deck = params.get("deck") || "dev-juninho-30-slides.json";
      document.documentElement.setAttribute("data-slides-config", deck);
      const link = document.createElement("link");
      link.rel = "preload";
      link.href = deck;
      link.as = "fetch";
      link.crossOrigin = "";
      document.head.appendChild(link);
    })();
  </script>
</head>
<body>
  <div class="deck" id="deck" aria-live="polite"></div>

  <div class="ui" role="toolbar" aria-label="Navegação da apresentação">
    <button type="button" id="prev" aria-label="Slide anterior">←</button>
    <span id="counter">…</span>
    <div class="progress" aria-hidden="true"><div class="progress__fill" id="progress"></div></div>
    <button type="button" id="next" aria-label="Próximo slide">Avançar →</button>
    <span class="hint">F = tela cheia</span>
  </div>

  <script type="module" src="assets/slides-renderer.js"></script>
</body>
</html>
